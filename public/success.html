<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>購買完成 · 短影音爆款企劃大師</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600&family=Noto+Serif+TC:wght@400;600;700;900&family=Playfair+Display:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="/assets/tailwind-config.js"></script>
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body data-page="success" class="antialiased min-h-screen">
  <div id="site-header"></div>

  <main class="max-w-xl mx-auto px-4 py-16 md:py-24 text-center">
    <div class="w-16 h-16 mx-auto rounded-full bg-editorial-card border border-editorial-border flex items-center justify-center text-editorial-accent text-2xl">✓</div>
    <p class="font-display italic text-editorial-accent text-sm mt-6">Thank you</p>
    <h1 class="font-serif font-bold text-3xl md:text-4xl mt-1">購買完成，歡迎加入</h1>
    <p class="text-editorial-muted mt-4 leading-relaxed">付款成功後帳號會自動開通，通常在一分鐘內完成。電子發票會寄到你付款時填的信箱。</p>

    <ol class="text-left bg-white rounded-3xl border border-editorial-border p-6 mt-8 grid gap-4">
      <li class="flex gap-4"><span class="font-display text-2xl text-editorial-accent leading-none">1</span><p class="text-sm leading-relaxed">到會員中心，用購買時的 Email 或 Google 帳號登入。</p></li>
      <li class="flex gap-4"><span class="font-display text-2xl text-editorial-accent leading-none">2</span><p class="text-sm leading-relaxed">確認方案狀態顯示「完整版」。</p></li>
      <li class="flex gap-4"><span class="font-display text-2xl text-editorial-accent leading-none">3</span><p class="text-sm leading-relaxed">到「開始使用」填主題，生成第一份企劃。</p></li>
    </ol>

    <div class="flex flex-wrap justify-center gap-3 mt-8">
      <a href="/account" class="bg-editorial-dark hover:bg-editorial-accent text-white text-sm px-6 py-3.5 rounded-full transition">前往會員中心</a>
      <a href="/app" class="border border-editorial-border hover:border-editorial-accent bg-white text-sm px-6 py-3.5 rounded-full transition">開始企劃</a>
    </div>
    <p class="text-xs text-editorial-muted mt-8">帳號超過 10 分鐘還沒開通，請來信 <span data-contact class="select-all"></span></p>
  </main>

  <div id="site-footer"></div>
  <script src="/assets/site.js"></script>
</body>
</html>
