<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>會員中心 · 短影音爆款企劃大師</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600&family=Noto+Serif+TC:wght@400;600;700;900&family=Playfair+Display:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="/assets/tailwind-config.js"></script>
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body data-page="account" class="antialiased min-h-screen">
  <div id="site-header"></div>

  <main class="max-w-4xl mx-auto px-4 py-12 md:py-16">
    <p class="font-display italic text-editorial-accent text-sm">Members</p>
    <h1 class="font-serif font-bold text-3xl md:text-4xl mt-1">會員中心</h1>

    <div class="grid grid-cols-1 md:grid-cols-5 gap-5 mt-8">
      <!-- 登入卡 -->
      <section class="md:col-span-3 bg-white rounded-3xl border border-editorial-border p-6 md:p-8">
        <h2 class="font-serif font-bold text-xl">登入你的帳號</h2>
        <p class="text-sm text-editorial-muted mt-2 leading-relaxed">購買後用同一個帳號登入，就能開始生成企劃。</p>

        <div class="grid gap-3 mt-6">
          <button id="btnGoogle" class="w-full flex items-center justify-center gap-3 border border-editorial-border hover:border-editorial-accent bg-editorial-bg/60 rounded-2xl py-3.5 text-sm font-medium transition">
            <span class="font-display font-bold text-base">G</span> 使用 Google 帳號登入
          </button>
          <div class="flex items-center gap-3 text-[11px] text-editorial-muted"><span class="flex-1 h-px bg-editorial-border"></span>或<span class="flex-1 h-px bg-editorial-border"></span></div>
          <label for="email" class="sr-only">Email</label>
          <input id="email" type="email" placeholder="輸入 Email，我們會寄登入連結給你" class="w-full text-sm p-3.5 rounded-2xl border border-editorial-border bg-editorial-bg/60 focus:ring-2 focus:ring-editorial-accent/30 focus:border-editorial-accent focus:outline-none">
          <button id="btnEmail" class="w-full bg-editorial-dark hover:bg-editorial-accent text-white rounded-2xl py-3.5 text-sm font-medium transition">寄送登入連結</button>
        </div>

        <p class="mt-5 text-xs leading-relaxed text-editorial-accentHover bg-editorial-card border border-editorial-border rounded-2xl p-3">
          會員登入功能即將開放。目前可以先到「開始使用」頁面看範例成果。
        </p>
      </section>

      <!-- 方案狀態 -->
      <aside class="md:col-span-2 grid gap-5 content-start">
        <section class="bg-editorial-card rounded-3xl border border-editorial-border p-6">
          <p class="text-[11px] font-semibold tracking-widest text-editorial-muted">方案狀態</p>
          <p class="font-serif font-bold text-xl mt-2">尚未購買</p>
          <p class="text-sm text-editorial-muted mt-2 leading-relaxed">完整版一次買斷 <span data-price class="font-semibold text-editorial-dark"></span>，每天可生成 <span data-daily-limit></span> 份企劃。</p>
          <a href="/#pricing" class="inline-block mt-4 text-sm text-editorial-accentHover hover:underline underline-offset-4">查看方案 →</a>
        </section>
        <section class="bg-white rounded-3xl border border-editorial-border p-6">
          <p class="text-[11px] font-semibold tracking-widest text-editorial-muted">登入後可以</p>
          <ul class="mt-3 grid gap-2 text-sm">
            <li class="flex gap-2"><span class="text-editorial-accent">✓</span>查看今天剩餘次數</li>
            <li class="flex gap-2"><span class="text-editorial-accent">✓</span>找回生成過的腳本</li>
            <li class="flex gap-2"><span class="text-editorial-accent">✓</span>查看購買紀錄與發票</li>
          </ul>
        </section>
      </aside>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="/assets/site.js"></script>
  <script>
    ['btnGoogle', 'btnEmail'].forEach(id =>
      document.getElementById(id).addEventListener('click', () => toast('會員登入即將開放，敬請期待')));
  </script>
</body>
</html>
